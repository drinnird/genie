<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>GenieX Local Chat</title>
  <style>
    :root {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light dark;
      --bg: #f7f7f8;
      --panel: #ffffff;
      --text: #171717;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #4f46e5;
      --accentText: #ffffff;
      --user: #e8e7ff;
      --assistant: #ffffff;
      --danger: #b91c1c;
      --ok: #137333;
      --shadow: 0 8px 30px rgba(0,0,0,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0f12;
        --panel: #15181d;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --line: #2b3038;
        --accent: #c7c5ff;
        --accentText: #171717;
        --user: #1e365e;
        --assistant: #15181d;
        --danger: #fca5a5;
        --ok: #86efac;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
    body { min-height: 100dvh; }
    button, input, textarea { font: inherit; }
    button { min-height: 44px; }
    .app { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }
    header {
      position: sticky; top: 0; z-index: 5;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    }
    .header-row { max-width: 960px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
    .title { min-width: 0; flex: 1; }
    h1 { font-size: 18px; margin: 0; }
    .sub { font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { border: 1px solid var(--line); border-radius: 999px; padding: 6px 9px; font-size: 12px; white-space: nowrap; }
    .badge.ok { color: var(--ok); }
    .badge.bad { color: var(--danger); }
    .toolbar { max-width: 960px; margin: 10px auto 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .toolbar input {
      flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 12px; background: var(--bg); color: var(--text);
    }
    .ghost {
      border: 1px solid var(--line); background: transparent; color: var(--text);
      border-radius: 10px; padding: 8px 12px; cursor: pointer;
    }
    main { width: 100%; }
    .messages { max-width: 960px; margin: 0 auto; padding: 18px 16px 220px; display: flex; flex-direction: column; gap: 14px; }
    .empty { margin: 12vh auto 0; max-width: 520px; text-align: center; color: var(--muted); padding: 24px; }
    .empty strong { display: block; color: var(--text); font-size: 20px; margin-bottom: 8px; }
    .message { display: flex; gap: 10px; align-items: flex-start; }
    .message.user { justify-content: flex-end; }
    .bubble {
      max-width: min(82%, 760px); padding: 12px 14px; border-radius: 16px; line-height: 1.5;
      border: 1px solid var(--line); background: var(--assistant); box-shadow: var(--shadow);
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .user .bubble { background: var(--user); box-shadow: none; }
    .assistant .bubble.markdown { white-space: normal; }
    .markdown > :first-child { margin-top: 0; }
    .markdown > :last-child { margin-bottom: 0; }
    .markdown p { margin: .55em 0; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4, .markdown h5, .markdown h6 {
      line-height: 1.25; margin: 1em 0 .45em; overflow-wrap: anywhere;
    }
    .markdown h1 { font-size: 1.45em; }
    .markdown h2 { font-size: 1.3em; }
    .markdown h3 { font-size: 1.16em; }
    .markdown ul, .markdown ol { margin: .55em 0; padding-left: 1.6em; }
    .markdown li { margin: .2em 0; }
    .markdown blockquote { margin: .7em 0; padding: .15em .8em; border-left: 3px solid var(--line); color: var(--muted); }
    .markdown code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; background: color-mix(in srgb, var(--text) 8%, transparent); padding: .12em .32em; border-radius: 5px; }
    .markdown pre { margin: .8em 0; padding: 12px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: color-mix(in srgb, var(--bg) 90%, var(--panel)); white-space: pre; }
    .markdown pre code { background: transparent; padding: 0; border-radius: 0; }
    .markdown table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: .8em 0; }
    .markdown th, .markdown td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; vertical-align: top; }
    .markdown th { background: color-mix(in srgb, var(--text) 6%, transparent); }
    .markdown a { color: var(--accent); overflow-wrap: anywhere; }
    .markdown hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
    .role { font-size: 11px; color: var(--muted); margin: 0 5px 4px; }
    .user .role { text-align: right; }
    .typing::after { content: "▍"; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .error { color: var(--danger); }
    .composer-wrap {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
      padding: 10px 16px max(12px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 75%, transparent);
    }
    .composer {
      max-width: 960px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line);
      border-radius: 18px; box-shadow: var(--shadow); padding: 10px; display: grid; gap: 8px;
    }
    textarea {
      width: 100%; resize: none; min-height: 48px; max-height: 180px; border: 0; outline: 0;
      padding: 8px 10px; background: transparent; color: var(--text); line-height: 1.4;
    }
    .docbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 2px 4px 6px; }
    .docbar[hidden] { display: none; }
    .docbar select { min-height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; background: var(--bg); color: var(--text); }
    .file-list { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 100%; max-height: 70px; overflow: auto; }
    .file-chip { max-width: 280px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-input { display: none; }
    .composer-actions { display: flex; align-items: center; gap: 8px; }
    .hint { flex: 1; color: var(--muted); font-size: 11px; padding-left: 8px; }
    .send, .stop {
      border: 0; border-radius: 12px; padding: 8px 18px; cursor: pointer; font-weight: 650;
    }
    .send { background: var(--accent); color: var(--accentText); }
    .stop { background: color-mix(in srgb, var(--danger) 12%, var(--panel)); color: var(--danger); }
    .send:disabled, .stop:disabled { opacity: .45; cursor: not-allowed; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 600px) {
      .messages { padding-left: 10px; padding-right: 10px; }
      .bubble { max-width: 92%; }
      .hint { display: none; }
      .toolbar { align-items: stretch; }
      .toolbar .ghost { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-row">
      <div class="title">
        <h1>GenieX Local Chat</h1>
        <div class="sub" id="modelText">Checking model…</div>
      </div>
      <div class="badge" id="statusBadge">Connecting</div>
    </div>
    <div class="toolbar">
      <label class="sr-only" for="apiKey">API key</label>
      <input id="apiKey" type="password" autocomplete="off" placeholder="API key (required for LAN access)">
      <button class="ghost" id="saveKey" type="button">Use key</button>
      <button class="ghost" id="copyApi" type="button">Copy API URL</button>
      <button class="ghost" id="clearChat" type="button">Clear chat</button>
    </div>
  </header>

  <main>
    <div class="messages" id="messages" aria-live="polite">
      <div class="empty" id="emptyState">
        <strong>Local, on-device chat</strong>
        Load a model in the Android app, start this server, then chat here from the phone or another device on your LAN.
      </div>
    </div>
  </main>

  <div class="composer-wrap">
    <div class="composer">
      <input class="file-input" id="txtFiles" type="file" accept=".txt,text/plain" multiple>
      <div class="docbar">
        <button class="ghost" id="attachTxt" type="button">Attach TXT</button>
        <select id="docMode" aria-label="Transcript mode">
          <option value="lecture">Lecture notes</option>
          <option value="ask">Ask files</option>
        </select>
        <button class="ghost" id="clearFiles" type="button" hidden>Remove files</button>
        <div class="file-list" id="fileList"></div>
      </div>
      <label class="sr-only" for="prompt">Message</label>
      <textarea id="prompt" rows="1" placeholder="Message the loaded model…" aria-label="Message"></textarea>
      <div class="composer-actions">
        <div class="hint">Enter to send • Shift+Enter for a new line</div>
        <button class="stop" id="stop" type="button" disabled>Stop</button>
        <button class="send" id="send" type="button" disabled>Send</button>
      </div>
    </div>
  </div>
</div>
<script>
(() => {
  const els = {
    messages: document.getElementById('messages'),
    empty: document.getElementById('emptyState'),
    prompt: document.getElementById('prompt'),
    send: document.getElementById('send'),
    stop: document.getElementById('stop'),
    key: document.getElementById('apiKey'),
    saveKey: document.getElementById('saveKey'),
    clear: document.getElementById('clearChat'),
    copyApi: document.getElementById('copyApi'),
    model: document.getElementById('modelText'),
    status: document.getElementById('statusBadge'),
    files: document.getElementById('txtFiles'),
    attachTxt: document.getElementById('attachTxt'),
    clearFiles: document.getElementById('clearFiles'),
    fileList: document.getElementById('fileList'),
    docMode: document.getElementById('docMode')
  };

  let messages = [];
  let busy = false;
  let modelLoaded = false;
  let apiKeyRequired = false;
  let maxOutputTokens = 2048;
  let followOutput = true;
  let activeController = null;
  let apiKey = sessionStorage.getItem('geniex_api_key') || '';
  let attachedFiles = [];
  try { attachedFiles = JSON.parse(sessionStorage.getItem('geniex_attached_files') || '[]'); } catch (_) {}
  els.key.value = apiKey;

  function authHeaders(json = false) {
    const h = {};
    if (json) h['Content-Type'] = 'application/json';
    if (apiKey) h['Authorization'] = `Bearer ${apiKey}`;
    return h;
  }

  function setStatus(text, ok = false, bad = false) {
    els.status.textContent = text;
    els.status.classList.toggle('ok', ok);
    els.status.classList.toggle('bad', bad);
  }

  function updateSendState() {
    const hasDocs = attachedFiles.length > 0;
    const docsReady = hasDocs && (els.docMode.value === 'lecture' || els.prompt.value.trim());
    els.send.disabled = busy || !modelLoaded || (apiKeyRequired && !apiKey) || (!els.prompt.value.trim() && !docsReady);
    els.stop.disabled = !busy;
  }

  function renderFiles() {
    els.fileList.replaceChildren();
    for (const file of attachedFiles) {
      const chip = document.createElement('div');
      chip.className = 'file-chip';
      chip.textContent = `${file.name} • ${Math.max(1, Math.round(file.size / 1024))} KB`;
      els.fileList.appendChild(chip);
    }
    els.clearFiles.hidden = attachedFiles.length === 0;
    sessionStorage.setItem('geniex_attached_files', JSON.stringify(attachedFiles));
    if (attachedFiles.length && els.docMode.value === 'lecture') {
      els.prompt.placeholder = 'Optional: customize the lecture-summary instructions…';
    } else if (attachedFiles.length) {
      els.prompt.placeholder = 'Ask a question about the attached transcripts…';
    } else {
      els.prompt.placeholder = 'Message the loaded model…';
    }
    updateSendState();
  }

  function growTextarea() {
    els.prompt.style.height = 'auto';
    els.prompt.style.height = `${Math.min(els.prompt.scrollHeight, 180)}px`;
  }

  function isNearBottom(threshold = 160) {
    const doc = document.documentElement;
    return window.scrollY + window.innerHeight >= doc.scrollHeight - threshold;
  }

  function scrollBottom(force = false) {
    if (!force && !followOutput) return;
    requestAnimationFrame(() => {
      if (!force && !followOutput) return;
      window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'auto' });
    });
  }

  window.addEventListener('scroll', () => {
    followOutput = isNearBottom();
  }, { passive: true });

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[ch]);
  }

  function safeHref(raw) {
    const decoded = String(raw).replace(/&amp;/g, '&').trim();
    try {
      const url = new URL(decoded, window.location.href);
      if (!['http:', 'https:', 'mailto:'].includes(url.protocol)) return null;
      return escapeHtml(decoded);
    } catch (_) {
      return null;
    }
  }

  function renderInlineMarkdown(raw) {
    const code = [];
    let text = escapeHtml(raw);
    text = text.replace(/`([^`\n]+)`/g, (_, value) => {
      const marker = `@@GENIEX_INLINE_${code.length}@@`;
      code.push(`<code>${value}</code>`);
      return marker;
    });
    text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (match, label, href) => {
      const safe = safeHref(href);
      return safe ? `<a href="${safe}" target="_blank" rel="noopener noreferrer">${label}</a>` : `${label} (${href})`;
    });
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    text = text.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    text = text.replace(/(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,!?:;])/g, '$1<em>$2</em>');
    text = text.replace(/(^|[\s(])_([^_\n]+)_(?=$|[\s).,!?:;])/g, '$1<em>$2</em>');
    code.forEach((value, index) => {
      text = text.replace(`@@GENIEX_INLINE_${index}@@`, value);
    });
    return text;
  }

  function splitTableRow(line) {
    let value = line.trim();
    if (value.startsWith('|')) value = value.slice(1);
    if (value.endsWith('|')) value = value.slice(0, -1);
    return value.split('|').map(cell => cell.trim());
  }

  function isTableDivider(line) {
    const cells = splitTableRow(line);
    return cells.length > 1 && cells.every(cell => /^:?-{3,}:?$/.test(cell));
  }

  // Safe, dependency-free Markdown renderer. Raw model HTML is always escaped
  // before Markdown syntax is converted, so generated <script>/event attributes
  // cannot become executable DOM.
  function markdownToHtml(markdown) {
    const lines = String(markdown || '').replace(/\r\n?/g, '\n').split('\n');
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i += 1; continue; }

      const fence = line.match(/^\s*```\s*([A-Za-z0-9_+.-]*)\s*$/);
      if (fence) {
        const lang = fence[1].replace(/[^A-Za-z0-9_+.-]/g, '');
        const body = [];
        i += 1;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) body.push(lines[i++]);
        if (i < lines.length) i += 1;
        out.push(`<pre><code${lang ? ` class="language-${lang}"` : ''}>${escapeHtml(body.join('\n'))}</code></pre>`);
        continue;
      }

      const heading = line.match(/^\s*(#{1,6})\s+(.+)$/);
      if (heading) {
        const level = heading[1].length;
        out.push(`<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`);
        i += 1;
        continue;
      }

      if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
        out.push('<hr>'); i += 1; continue;
      }

      if (line.includes('|') && i + 1 < lines.length && isTableDivider(lines[i + 1])) {
        const headers = splitTableRow(line);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(splitTableRow(lines[i++]));
        out.push('<table><thead><tr>' + headers.map(cell => `<th>${renderInlineMarkdown(cell)}</th>`).join('') + '</tr></thead><tbody>' +
          rows.map(row => '<tr>' + headers.map((_, idx) => `<td>${renderInlineMarkdown(row[idx] || '')}</td>`).join('') + '</tr>').join('') +
          '</tbody></table>');
        continue;
      }

      const unordered = line.match(/^\s*[-+*]\s+(.+)$/);
      const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
      if (unordered || ordered) {
        const tag = unordered ? 'ul' : 'ol';
        const items = [];
        while (i < lines.length) {
          const match = tag === 'ul' ? lines[i].match(/^\s*[-+*]\s+(.+)$/) : lines[i].match(/^\s*\d+[.)]\s+(.+)$/);
          if (!match) break;
          items.push(`<li>${renderInlineMarkdown(match[1])}</li>`);
          i += 1;
        }
        out.push(`<${tag}>${items.join('')}</${tag}>`);
        continue;
      }

      if (/^\s*>/.test(line)) {
        const quote = [];
        while (i < lines.length) {
          const match = lines[i].match(/^\s*>\s?(.*)$/);
          if (!match) break;
          quote.push(match[1]); i += 1;
        }
        out.push(`<blockquote>${quote.map(renderInlineMarkdown).join('<br>')}</blockquote>`);
        continue;
      }

      const paragraph = [line.trim()];
      i += 1;
      while (i < lines.length && lines[i].trim()) {
        const next = lines[i];
        if (/^\s*```/.test(next) || /^\s*#{1,6}\s+/.test(next) || /^\s*[-+*]\s+/.test(next) || /^\s*\d+[.)]\s+/.test(next) || /^\s*>/.test(next)) break;
        if (next.includes('|') && i + 1 < lines.length && isTableDivider(lines[i + 1])) break;
        paragraph.push(next.trim()); i += 1;
      }
      out.push(`<p>${paragraph.map(renderInlineMarkdown).join('<br>')}</p>`);
    }
    return out.join('');
  }

  const pendingMarkdown = new WeakMap();

  function cancelPendingMarkdown(bubble) {
    const state = pendingMarkdown.get(bubble);
    if (!state) return;
    if (state.frame) cancelAnimationFrame(state.frame);
    if (state.fallback) clearTimeout(state.fallback);
    pendingMarkdown.delete(bubble);
  }

  function renderPendingMarkdown(bubble) {
    const state = pendingMarkdown.get(bubble);
    if (!state) return;
    if (state.fallback) clearTimeout(state.fallback);
    const follow = followOutput;
    bubble.innerHTML = markdownToHtml(state.text);
    pendingMarkdown.delete(bubble);
    if (follow) scrollBottom();
  }

  function setBubblePlain(bubble, text) {
    cancelPendingMarkdown(bubble);
    bubble.classList.remove('markdown');
    bubble.textContent = text;
  }

  function setBubbleMarkdown(bubble, text, immediate = false) {
    bubble.classList.add('markdown');
    if (immediate) {
      cancelPendingMarkdown(bubble);
      const follow = followOutput;
      bubble.innerHTML = markdownToHtml(text);
      if (follow) scrollBottom();
      return;
    }

    let state = pendingMarkdown.get(bubble);
    if (state) {
      // Keep just the newest complete text. One animation-frame render consumes
      // every token that arrived since the previous paint without adding a
      // coarse artificial delay to fast generation.
      state.text = text;
      return;
    }

    state = { text, frame: 0, fallback: 0 };
    pendingMarkdown.set(bubble, state);
    state.frame = requestAnimationFrame(() => renderPendingMarkdown(bubble));
    // requestAnimationFrame may be suspended in a background browser tab.
    // Keep a bounded fallback so the DOM still advances for non-visible clients.
    state.fallback = setTimeout(() => {
      const current = pendingMarkdown.get(bubble);
      if (!current) return;
      if (current.frame) cancelAnimationFrame(current.frame);
      renderPendingMarkdown(bubble);
    }, 50);
  }

  function addBubble(role, text = '', error = false) {
    els.empty.hidden = true;
    const row = document.createElement('div');
    row.className = `message ${role === 'user' ? 'user' : 'assistant'}`;
    const wrap = document.createElement('div');
    const label = document.createElement('div');
    label.className = 'role';
    label.textContent = role === 'user' ? 'You' : 'Assistant';
    const bubble = document.createElement('div');
    bubble.className = `bubble${error ? ' error' : ''}`;
    if (role === 'assistant' && !error) setBubbleMarkdown(bubble, text, true);
    else setBubblePlain(bubble, text);
    wrap.append(label, bubble);
    row.appendChild(wrap);
    els.messages.appendChild(row);
    followOutput = true;
    scrollBottom(true);
    return bubble;
  }

  function clearChat() {
    messages = [];
    els.messages.querySelectorAll('.message').forEach(node => node.remove());
    els.empty.hidden = false;
  }

  async function refreshStatus() {
    if (busy) return;
    try {
      const health = await fetch('/health', { cache: 'no-store' });
      modelLoaded = health.ok;
      if (!health.ok) {
        els.model.textContent = 'No model loaded';
        setStatus('No model', false, true);
        updateSendState();
        return;
      }
      const healthData = await health.json();
      apiKeyRequired = healthData.auth_required === true;
      if (healthData.busy) setStatus('Busy', false, false);
      if (apiKeyRequired && !apiKey) {
        els.model.textContent = 'Model loaded • API key required';
        els.key.placeholder = 'Please enter the API key from the Android Server screen';
        els.key.setAttribute('aria-invalid', 'true');
        setStatus('Enter API key', false, true);
        updateSendState();
        return;
      }
      els.key.placeholder = 'API key (required for LAN access)';
      els.key.removeAttribute('aria-invalid');
      const models = await fetch('/v1/models', { headers: authHeaders(), cache: 'no-store' });
      if (models.status === 401) {
        els.model.textContent = 'Model loaded • API key required';
        setStatus('Key required', false, true);
        updateSendState();
        return;
      }
      if (!models.ok) throw new Error(`HTTP ${models.status}`);
      const data = await models.json();
      const model = data.data?.[0];
      const contextWindow = model?.context_window || healthData.context_window;
      maxOutputTokens = model?.max_output_tokens || healthData.max_output_tokens || 2048;
      els.model.textContent = model
        ? `${model.name || model.id} • ${(model.compute || 'unknown').toUpperCase()}${contextWindow ? ` • ${contextWindow} ctx` : ''}`
        : 'Model loaded';
      setStatus('Ready', true, false);
    } catch (err) {
      modelLoaded = false;
      els.model.textContent = 'Server unavailable';
      setStatus('Offline', false, true);
    }
    updateSendState();
  }

  async function uploadSelectedFiles(fileList) {
    if (!fileList?.length) return;
    if (apiKeyRequired && !apiKey) {
      addBubble('assistant', 'Please enter the API key before uploading transcripts.', true);
      els.key.focus();
      return;
    }
    busy = true;
    updateSendState();
    setStatus('Uploading transcripts');
    try {
      for (const file of Array.from(fileList)) {
        if (!file.name.toLowerCase().endsWith('.txt')) throw new Error(`${file.name}: only .txt files are supported`);
        const response = await fetch('/v1/files', {
          method: 'POST',
          headers: { ...authHeaders(), 'Content-Type': 'text/plain; charset=utf-8', 'X-Filename': encodeURIComponent(file.name) },
          body: file
        });
        if (!response.ok) {
          let detail = `Upload failed: HTTP ${response.status}`;
          try { detail = (await response.json()).error?.message || detail; } catch (_) {}
          throw new Error(detail);
        }
        const stored = await response.json();
        attachedFiles.push(stored);
        renderFiles();
      }
      setStatus('Ready', true, false);
    } catch (err) {
      addBubble('assistant', err instanceof Error ? err.message : String(err), true);
      setStatus('Upload failed', false, true);
    } finally {
      busy = false;
      els.files.value = '';
      updateSendState();
    }
  }

  async function sendDocumentMessage(text) {
    if (!attachedFiles.length) return;
    if (els.docMode.value === 'ask' && !text.trim()) {
      addBubble('assistant', 'Type a question about the attached transcripts.', true);
      return;
    }
    busy = true;
    updateSendState();
    activeController = new AbortController();
    const ids = attachedFiles.map(f => f.id);
    if (els.docMode.value === 'lecture') {
      addBubble('user', `Summarize ${attachedFiles.length} attached lecture transcript${attachedFiles.length === 1 ? '' : 's'}.`);
      const assistantBubble = addBubble('assistant', 'Preparing lecture notes…');
      assistantBubble.classList.add('typing');
      try {
        const response = await fetch('/v1/documents/summarize', {
          method: 'POST', headers: authHeaders(true), signal: activeController.signal,
          body: JSON.stringify({ file_ids: ids, ...(text.trim() ? { prompt: text.trim() } : {}) })
        });
        if (!response.ok || !response.body) {
          let detail = `HTTP ${response.status}`;
          try { detail = (await response.json()).error?.message || detail; } catch (_) {}
          throw new Error(detail);
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let finalContent = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let split;
          while ((split = buffer.indexOf('\n\n')) >= 0) {
            const event = buffer.slice(0, split); buffer = buffer.slice(split + 2);
            for (const line of event.split('\n')) {
              if (!line.startsWith('data:')) continue;
              const payload = line.slice(5).trim();
              if (!payload || payload === '[DONE]') continue;
              const data = JSON.parse(payload);
              if (data.error) throw new Error(data.error.message || 'Document summary failed');
              if (data.type === 'progress') {
                setBubblePlain(assistantBubble, `${data.phase}${data.total ? ` • ${data.completed}/${data.total}` : ''}${data.detail ? ` • ${data.detail}` : ''}`);
              } else if (data.type === 'result') {
                finalContent = data.content || '';
                setBubbleMarkdown(assistantBubble, finalContent, true);
              }
            }
          }
        }
        assistantBubble.classList.remove('typing');
        els.docMode.value = 'ask';
        renderFiles();
      } catch (err) {
        assistantBubble.classList.remove('typing');
        assistantBubble.classList.add('error');
        setBubblePlain(assistantBubble, err?.name === 'AbortError' ? 'Document processing stopped.' : (err instanceof Error ? err.message : String(err)));
      }
    } else {
      addBubble('user', text);
      const assistantBubble = addBubble('assistant', 'Searching transcripts…');
      assistantBubble.classList.add('typing');
      try {
        const response = await fetch('/v1/documents/query', {
          method: 'POST', headers: authHeaders(true), signal: activeController.signal,
          body: JSON.stringify({ file_ids: ids, question: text })
        });
        if (!response.ok) {
          let detail = `HTTP ${response.status}`;
          try { detail = (await response.json()).error?.message || detail; } catch (_) {}
          throw new Error(detail);
        }
        const data = await response.json();
        assistantBubble.classList.remove('typing');
        setBubbleMarkdown(assistantBubble, data.answer || 'No answer returned.', true);
      } catch (err) {
        assistantBubble.classList.remove('typing');
        assistantBubble.classList.add('error');
        setBubblePlain(assistantBubble, err?.name === 'AbortError' ? 'Request stopped.' : (err instanceof Error ? err.message : String(err)));
      }
    }
    activeController = null;
    busy = false;
    els.prompt.value = '';
    growTextarea();
    updateSendState();
  }

  async function sendMessage() {
    const text = els.prompt.value.trim();
    const blankLectureRequest = attachedFiles.length > 0 && els.docMode.value === 'lecture';
    if ((!text && !blankLectureRequest) || busy || !modelLoaded) return;
    if (apiKeyRequired && !apiKey) {
      addBubble('assistant', 'Please enter the API key shown on the Android Server screen, then tap Use key.', true);
      setStatus('Enter API key', false, true);
      els.key.focus();
      return;
    }
    if (attachedFiles.length) {
      await sendDocumentMessage(text);
      return;
    }

    busy = true;
    els.prompt.value = '';
    growTextarea();
    updateSendState();

    messages.push({ role: 'user', content: text });
    addBubble('user', text);
    const assistantBubble = addBubble('assistant', '');
    assistantBubble.classList.add('typing');

    try {
      activeController = new AbortController();
      const response = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers: authHeaders(true),
        signal: activeController.signal,
        body: JSON.stringify({
          model: 'loaded-model',
          messages,
          stream: true,
          max_tokens: maxOutputTokens
        })
      });

      if (response.status === 401) {
        apiKeyRequired = true;
        throw new Error(apiKey ? 'API key rejected. Check the key shown in the Android Server screen.' : 'Please enter the API key shown on the Android Server screen.');
      }
      if (!response.ok || !response.body) {
        let detail = `HTTP ${response.status}`;
        try { detail = (await response.json()).error?.message || detail; } catch (_) {}
        throw new Error(detail);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let answer = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let split;
        while ((split = buffer.indexOf('\n\n')) >= 0) {
          const event = buffer.slice(0, split);
          buffer = buffer.slice(split + 2);
          for (const line of event.split('\n')) {
            if (!line.startsWith('data:')) continue;
            const payload = line.slice(5).trim();
            if (!payload || payload === '[DONE]') continue;
            const data = JSON.parse(payload);
            if (data.error) throw new Error(data.error.message || 'Inference failed');
            const token = data.choices?.[0]?.delta?.content || '';
            if (token) {
              answer += token;
              setBubbleMarkdown(assistantBubble, answer);
            }
          }
        }
      }

      assistantBubble.classList.remove('typing');
      setBubbleMarkdown(assistantBubble, answer, true);
      messages.push({ role: 'assistant', content: answer });
    } catch (err) {
      assistantBubble.classList.remove('typing');
      if (err?.name === 'AbortError') {
        if (!assistantBubble.textContent) setBubblePlain(assistantBubble, 'Generation stopped.');
      } else {
        assistantBubble.classList.add('error');
        setBubblePlain(assistantBubble, err instanceof Error ? err.message : String(err));
      }
    } finally {
      activeController = null;
      busy = false;
      updateSendState();
      els.prompt.focus();
    }
  }

  async function stopGeneration() {
    if (!busy) return;
    activeController?.abort();
    try {
      await fetch('/v1/stop', { method: 'POST', headers: authHeaders() });
    } catch (_) {}
  }

  els.attachTxt.addEventListener('click', () => els.files.click());
  els.files.addEventListener('change', () => uploadSelectedFiles(els.files.files));
  els.clearFiles.addEventListener('click', () => { attachedFiles = []; renderFiles(); });
  els.docMode.addEventListener('change', renderFiles);
  els.stop.addEventListener('click', stopGeneration);
  els.saveKey.addEventListener('click', () => {
    apiKey = els.key.value.trim();
    if (apiKey) {
      sessionStorage.setItem('geniex_api_key', apiKey);
      els.key.removeAttribute('aria-invalid');
    } else {
      sessionStorage.removeItem('geniex_api_key');
    }
    if (!apiKey && apiKeyRequired) setStatus('Enter API key', false, true);
    refreshStatus();
  });

  els.copyApi.addEventListener('click', async () => {
    const value = `${location.origin}/v1`;
    try {
      await navigator.clipboard.writeText(value);
      const old = els.copyApi.textContent;
      els.copyApi.textContent = 'Copied';
      setTimeout(() => { els.copyApi.textContent = old; }, 1200);
    } catch (_) {
      window.prompt('API URL', value);
    }
  });

  els.clear.addEventListener('click', clearChat);
  els.send.addEventListener('click', sendMessage);
  els.prompt.addEventListener('input', () => { growTextarea(); updateSendState(); });
  els.prompt.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  renderFiles();
  refreshStatus();
  setInterval(refreshStatus, 30000);
  growTextarea();
})();
</script>
</body>
</html>
